# Configuración del tmux de la app Claude. Se instala en /etc/miputer-claude/tmux.conf
# (fuera del alcance de mpclaude, para que Claude no pueda cambiar quién se conecta).

# Deja que el servidor web (usuario miputer) se conecte como cliente.
server-access -a miputer

set -g status off
set -g mouse on
set -g history-limit 20000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
