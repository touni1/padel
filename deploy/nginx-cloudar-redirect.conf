# cloudar.co y www.cloudar.co → MiPuter. Se instala en /etc/nginx/sites-available/cloudar-redirect
# (certbot --nginx añade el bloque HTTPS). 302 y no 301 a propósito: los navegadores
# guardan los 301 para siempre y el dominio raíz puede usarse para otra cosa más adelante.
server {
    listen 80;
    listen [::]:80;
    server_name cloudar.co www.cloudar.co;
    return 302 https://miputer.cloudar.co$request_uri;
}
