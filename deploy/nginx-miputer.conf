# Proxy inverso de MiPuter. Se instala en /etc/nginx/sites-available/miputer
# (certbot --nginx añade después el bloque HTTPS y la redirección desde HTTP).
map $http_upgrade $miputer_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name miputer.cloudar.co;

    # Grande por las subidas de "pedir archivos"; server.js pone los límites de verdad.
    client_max_body_size 5g;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se sobrescribe (no se añade) porque server.js confía en la primera IP de la lista.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $miputer_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
    }
}
